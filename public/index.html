<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Manager</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <style>
        :root {
            --bg: #1a1a1a;
            --card: #2d2d2d;
            --text: #eeeeee;
            --primary: #3498db;
            --danger: #e74c3c;
            --success: #2ecc71;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; color: var(--primary); }
        
        .section { background: var(--card); padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        
        ul { list-style: none; padding: 0; }
        li { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 12px; 
            border-bottom: 1px solid #444; 
            transition: background 0.2s;
        }
        li:hover { background: #383838; }
        
        .file-info { display: flex; align-items: center; gap: 10px; font-weight: 500; flex: 1; }
        .actions { display: flex; gap: 10px; }
        
        button { 
            border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; 
            font-weight: bold; transition: opacity 0.2s; color: white;
        }
        button:hover { opacity: 0.8; }
        .btn-move-series { background: var(--primary); }
        .btn-move-films { background: var(--success); }
        .btn-delete { background: var(--danger); }
        
        input[type="text"] {
            background: #444; border: 1px solid #555; color: white;
            padding: 5px; border-radius: 4px; width: 120px;
        }
        select {
            background: #444; border: 1px solid #555; color: white;
            padding: 5px; border-radius: 4px; max-width: 220px;
        }
        .new-folder { display: none; }
    </style>
</head>
<body>
<nav style="margin-bottom: 20px; text-align: center;">
    <a href="/" style="color: #3498db; margin-right: 20px; text-decoration: none; font-weight: bold;">📥 Tri des Torrents</a>
    <a href="/rename-page" style="color: #3498db; text-decoration: none; font-weight: bold;">✏️ Renommer Médias</a>
</nav>
<div class="container">
    <h1>🎬 Media Manager <button onclick="loadData()" style="background:none; font-size: 0.5em; vertical-align: middle;">🔄</button></h1>

    <div class="section">
        <h2>📥 Torrents à traiter</h2>
        <ul id="torrents-list">
            </ul>
    </div>
</div>

<script>
    // Chargement initial
    async function loadData() {
        try {
            const response = await fetch('/files');
            const data = await response.json();
            const list = document.getElementById("torrents-list");
            list.innerHTML = "";

            if (data.torrents.length === 0) {
                list.innerHTML = "<p style='text-align:center; color:#888;'>Aucun fichier à traiter.</p>";
                return;
            }

            data.torrents.forEach(file => {
                const li = document.createElement("li");
                
                // Logique d'icône : dossier si pas d'extension pointée à la fin
                const isFile = file.includes('.');
                const icon = isFile ? "🎬" : "📂";

                const key = btoa(unescape(encodeURIComponent(file)));

                const info = document.createElement("div");
                info.className = "file-info";
                const iconSpan = document.createElement("span");
                iconSpan.textContent = icon;
                const nameSpan = document.createElement("span");
                nameSpan.textContent = file;
                info.append(iconSpan, nameSpan);

                const actions = document.createElement("div");
                actions.className = "actions";

                // Liste des dossiers de séries déjà existants + création d'un nouveau
                const select = document.createElement("select");
                select.id = `folder-${key}`;
                select.innerHTML = `<option value="">— choisir un dossier de série —</option>`
                    + data.series.map(s => `<option value="${s.replace(/"/g, "&quot;")}">${s}</option>`).join("")
                    + `<option value="__new__">➕ Nouveau dossier…</option>`;

                const newFolder = document.createElement("input");
                newFolder.type = "text";
                newFolder.id = `newfolder-${key}`;
                newFolder.className = "new-folder";
                newFolder.placeholder = "Nouveau dossier…";
                select.addEventListener("change", () => {
                    const creating = select.value === "__new__";
                    newFolder.classList.toggle("new-folder", !creating);
                    if (creating) newFolder.focus();
                });

                const btnSeries = document.createElement("button");
                btnSeries.className = "btn-move-series";
                btnSeries.textContent = "Série";
                btnSeries.addEventListener("click", () => move(file, "series"));

                const btnFilms = document.createElement("button");
                btnFilms.className = "btn-move-films";
                btnFilms.textContent = "Film";
                btnFilms.addEventListener("click", () => move(file, "films"));

                const btnDel = document.createElement("button");
                btnDel.className = "btn-delete";
                btnDel.textContent = "🗑️";
                btnDel.addEventListener("click", () => remove(file));

                actions.append(select, newFolder, btnSeries, btnFilms, btnDel);
                li.append(info, actions);
                list.appendChild(li);
            });
        } catch (err) {
            console.error("Erreur chargement:", err);
        }
    }

    function destFolderFor(file) {
        const key = btoa(unescape(encodeURIComponent(file)));
        const select = document.getElementById(`folder-${key}`);
        if (!select) return "";
        if (select.value === "__new__") {
            const input = document.getElementById(`newfolder-${key}`);
            return (input && input.value ? input.value : "").trim();
        }
        return select.value;
    }

    async function move(file, type) {
        const destFolder = destFolderFor(file);
        if (type === 'series' && !destFolder) {
            alert("Choisis un dossier de série dans la liste, ou crée-le avec « Nouveau dossier… ».");
            return;
        }

        const res = await fetch('/move', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ file, type, destFolder })
        });

        if (res.ok) loadData();
        else alert("Erreur lors du déplacement");
    }

    async function remove(file) {
        if (!confirm(`Supprimer définitivement ${file} ?`)) return;

        const res = await fetch('/delete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ file })
        });

        if (res.ok) loadData();
        else alert("Erreur lors de la suppression");
    }

    // Lancer au démarrage
    loadData();
    // Rafraîchir les données toutes les 30 secondes (30000 millisecondes)
setInterval(() => {
    const el = document.activeElement;
    // ne pas reconstruire la liste pendant que l'utilisateur choisit un dossier
    if (el && (el.tagName === 'SELECT' || el.tagName === 'INPUT')) return;
    loadData();
}, 30000);
</script>

</body>
</html>
